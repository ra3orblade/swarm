# Swarm's own coordination rules (dogfood). See docs/13-config.md.
[rules]
# Two parallel sessions clobbered each other in this checkout this week —
# broad staging and destructive git are hard-denied while a tree is shared.
shared_tree = "deny"
destructive_git = "deny"
pattern_kill = "ask"
protected_ports = "deny"

[rules.protected]
# The Swarm daemon itself.
ports = [7777]

[tasks]
# The roadmap is the backlog: Board shows what's ready, `swarm tasks --ready` / swarm_next_task answer "what next".
source = "docs/06-roadmap.md"

[gates]
# Every task passes review before it counts as done; `swarm gate record <task> review pass --rubric "…"`.
# tests + lint run themselves (`swarm gate run <task>`), review is a recorded verdict.
required = ["tests", "lint", "review"]

[worktree]
# New worktrees (claims, `swarm wt create`, dispatch) start warm: deps installed, nothing to copy.
setup = "bun install"

[gates.tests]
cmd = "bun run test"
[gates.lint]
cmd = "bun run lint && bun run typecheck"

[dispatch]
# Two autonomous runs at a time is what this machine and one reviewer can keep up with.
max_parallel = 2
