[package]
name = "swarm-desktop"
version = "0.11.2"
description = "Swarm — local control plane for AI-agent development"
edition = "2021"

# Name the executable "Swarm" so macOS shows it (menu bar, dev runs) instead of the crate name.
[[bin]]
name = "Swarm"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
serde_json = "1"

[lib]
name = "swarm_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
strip = true
lto = true
