name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write   # npm provenance

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest       # Apple silicon
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
          - platform: ubuntu-22.04        # Linux x86_64 (.deb / .rpm / .AppImage)
            args: ""
            rust-targets: ""
          - platform: windows-latest      # Windows x86_64 (.msi / .exe)
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - name: Linux build deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev build-essential libfuse2
      - run: bun install --frozen-lockfile
      # build web assets + compile the daemon sidecar (native to this runner) + stage resources
      - run: bun run desktop:prep
      # Release notes = this version's CHANGELOG.md section (tools/version.ts refuses to bump
      # without one). The body is identical on every matrix leg, so tauri-action keeps it.
      - name: Release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          {
            echo "body<<__NOTES__"
            awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md
            echo
            echo "---"
            echo "Install: \`bunx @ra3orblade/swarm setup\` · Docs: https://getswarm.vercel.app/docs/ · Changelog: https://getswarm.vercel.app/changelog"
            echo "__NOTES__"
          } >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # linuxdeploy's own strip step fails on GH runners; the release profile already strips.
          NO_STRIP: "true"
          # linuxdeploy runs `patchelf` over every ELF file in the AppDir, which corrupts a
          # `bun build --compile` binary; the Linux build therefore ships the daemon gzipped as a
          # resource instead of as an externalBin (tauri.linux.conf.json). M6.4 in docs/06.
          # macOS signing + notarization (ignored on other platforms). Reuses the Apple account
          # creds, mapped from electron-builder / Brainstorm names to Tauri's. See docs/11.
          APPLE_CERTIFICATE: ${{ secrets.CSC_LINK }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Tauri updater signing key (same key signs every platform's update package).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Swarm ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          args: ${{ matrix.args }}

  npm:
    # Publishes @ra3orblade/swarm (bundled bins + dashboard) on every v* tag via npm Trusted
    # Publishing (OIDC) — no NPM_TOKEN secret, same setup as fancy-menus. Authorized by the
    # trusted-publisher rule on npmjs.com that pins this repo + this workflow filename
    # (release.yml). Provenance is emitted automatically under OIDC.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      # No `registry-url`: with it, setup-node writes an empty `_authToken` to .npmrc, which
      # shadows the OIDC exchange and makes `npm publish` 404.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Trusted publishing needs npm >= 11.5.1; Node 22 bundles an older one.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      - run: bun run build:pkg
      - name: Tag must match package version
        run: |
          PKG=$(node -p "require('./npm/package.json').version")
          test "v$PKG" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != npm/package.json $PKG"; exit 1; }
      - run: bun npm/dist/swarm.js --help
      # A version npm already has is skipped rather than failed, so a release whose run broke
      # after this step (or that was finished by hand) can be re-run to green.
      - name: Publish to npm
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "@ra3orblade/swarm@$V" version >/dev/null 2>&1; then echo "@ra3orblade/swarm@$V is already on npm — skipped"; exit 0; fi
          npm publish --access public
        working-directory: npm

  team:
    # M13.13 (OQ-27): the team daemon ships beside the free package, never inside it — its own
    # npm package, a ghcr image, and per-platform binaries the desktop app downloads when someone
    # chooses to host. FSL-1.1-ALv2. Two one-time steps live outside this file (docs/14): the
    # first `npm publish` of @ra3orblade/swarm-team is done by hand, after which a trusted-publisher
    # rule like the one for @ra3orblade/swarm authorizes this job; and the ghcr package is made
    # public once after its first push.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # ghcr.io/ra3orblade/swarm-teamd
      id-token: write # npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      - run: bun run build:team --binaries
      - name: Tag must match package version
        run: |
          PKG=$(node -p "require('./npm-team/package.json').version")
          test "v$PKG" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != npm-team $PKG"; exit 1; }
      - name: Smoke — the bundle answers health
        run: |
          SWARM_HOME="$RUNNER_TEMP/teamd" SWARM_TEAM_PORT=7899 SWARM_TEAM_TOKEN=smoke bun npm-team/dist/swarm-teamd.js &
          for _ in $(seq 1 30); do curl -sf localhost:7899/t1/health && break; sleep 0.5; done
          curl -sf localhost:7899/t1/health
          kill %1
      - uses: actions/upload-artifact@v4
        with:
          name: swarm-teamd-binaries
          path: npm-team/bin/*
          if-no-files-found: error
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/team/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/ra3orblade/swarm-teamd:${{ github.ref_name }}
            ghcr.io/ra3orblade/swarm-teamd:latest
      # Last, so a package without its trusted-publisher rule yet (the first release) fails only
      # this step — the image and the binaries still ship.
      # Skipped when npm already has this version — see the npm job.
      - name: Publish @ra3orblade/swarm-team to npm
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "@ra3orblade/swarm-team@$V" version >/dev/null 2>&1; then echo "@ra3orblade/swarm-team@$V is already on npm — skipped"; exit 0; fi
          npm publish --access public
        working-directory: npm-team

  team-release-assets:
    # The binaries go on the same draft release tauri-action creates, so wait for it to exist.
    needs: [desktop, team]
    # the binaries are an artifact of `team` uploaded before its npm step, so a failed npm publish
    # must not keep them off the release
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.desktop.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: swarm-teamd-binaries
          path: bin
      - name: Attach swarm-teamd binaries to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" bin/* --clobber --repo "$GITHUB_REPOSITORY"
