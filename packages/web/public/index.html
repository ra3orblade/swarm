<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Harness</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#0f1115;--panel:#161920;--line:#262a33;--fg:#d9dde3;--dim:#7d8590;--acc:#5aa9ff;--ok:#3fb950;--warn:#d29922;--bad:#f85149;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
  @media (prefers-color-scheme: light){:root{--bg:#fafafa;--panel:#fff;--line:#e3e5e8;--fg:#1f2328;--dim:#6e7781;--acc:#0969da}}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.45 system-ui,sans-serif;height:100vh;display:grid;grid-template-rows:40px 1fr;grid-template-columns:220px 1fr}
  header{grid-column:1/3;display:flex;align-items:center;gap:16px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--panel)}
  header b{letter-spacing:.04em}header .sp{flex:1}header .dot{width:8px;height:8px;border-radius:50%;background:var(--bad);display:inline-block;margin-right:6px}header .dot.on{background:var(--ok)}
  aside{border-right:1px solid var(--line);background:var(--panel);padding:10px;overflow:auto}
  aside h4{margin:6px 4px;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
  .proj{padding:6px 8px;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:8px}.proj:hover{background:var(--line)}.proj.sel{background:var(--line)}
  .proj .st{width:8px;height:8px;border-radius:50%;background:var(--dim)}.proj .st.live{background:var(--ok)}.proj small{color:var(--dim);margin-left:auto}
  .proj .x{opacity:0;color:var(--dim);padding:0 4px}.proj:hover .x{opacity:1}.proj .x:hover{color:var(--bad)}
  aside form{display:flex;gap:4px;margin-top:10px}aside input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);color:var(--fg);padding:5px 7px;border-radius:5px;font:inherit}
  button{background:var(--bg);border:1px solid var(--line);color:var(--fg);padding:5px 9px;border-radius:5px;font:inherit;cursor:pointer}button:hover{border-color:var(--acc)}
  main{overflow:auto;padding:14px}
  h2{font-size:13px;margin:0 0 8px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.08em;display:flex;gap:10px;align-items:baseline}h2 span{font-weight:400;text-transform:none;letter-spacing:0}
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
  table{table-layout:fixed}th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  th{color:var(--dim);font-weight:500;font-size:11px}tr:last-child td{border-bottom:0}tbody tr{cursor:pointer}td:first-child{overflow:visible;text-overflow:clip}tbody tr:hover{background:var(--line)}
  td.now,td.br{font-family:var(--mono);font-size:12px}
  .badge{display:inline-block;font:11px system-ui;padding:1px 6px;border-radius:10px;background:var(--line);color:var(--dim);margin-right:4px}.badge.warn{color:var(--warn);background:rgba(210,153,34,.12)}.badge.acc{color:var(--acc);background:rgba(90,169,255,.12)}
  td a{color:var(--acc);text-decoration:none}
  .s{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:2px}.s.active{background:var(--ok);box-shadow:0 0 0 3px rgba(63,185,80,.15)}.s.waiting{background:var(--warn)}.s.ended{background:var(--dim)}
  .empty{color:var(--dim);padding:30px;text-align:center;border:1px dashed var(--line);border-radius:8px}
  #log{font-family:var(--mono);font-size:12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 0;max-height:calc(100vh - 220px);overflow:auto}
  .ev{display:grid;grid-template-columns:70px 110px 1fr;gap:10px;padding:3px 12px}.ev:hover{background:var(--line)}.ev .t{color:var(--dim)}.ev .k{color:var(--acc)}
  .ev.tool\.completed .k{color:var(--dim)}.ev.incident\.opened .k,.ev.incident\.opened .m{color:var(--warn)}.ev.session\.ended .k{color:var(--bad)}.ev.prompt\.submitted .k{color:var(--ok)}
  .ev .m{white-space:pre-wrap;word-break:break-word}
  .back{color:var(--acc);cursor:pointer;text-decoration:none}
  kbd,code{font:inherit;color:var(--dim)}.dim{color:var(--dim)}.mono{font-family:var(--mono);font-size:11px}.num{text-align:right;font-variant-numeric:tabular-nums}
  header .nav{color:var(--dim);text-decoration:none;padding:4px 8px;border-radius:5px}header .nav.on{color:var(--fg);background:var(--line)}header #today{margin-right:16px}
  .proj .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sess{display:grid;grid-template-columns:1fr 260px;gap:14px;align-items:start}.side{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;position:sticky;top:0}
  .stat{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--line)}.stat span{color:var(--dim)}.stat b{font-weight:600}.stat small{color:var(--dim);font-weight:400}
  .side h4{margin:12px 0 4px;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.08em}table.mini{border:0;background:none}table.mini td{padding:2px 0;border:0}
  .ev.assistant .k{color:var(--fg)}.ev.assistant .m{color:var(--fg)}.ev.tool\.requested .m{color:var(--dim)}
  .bars{display:flex;gap:6px;align-items:flex-end;height:90px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px 22px;margin-bottom:14px}.bar{flex:1;height:100%;position:relative;display:flex;align-items:flex-end}.bar div{width:100%;background:var(--acc);border-radius:3px 3px 0 0;min-height:1px;opacity:.85}.bar span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:10px;color:var(--dim)}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
</style>
</head>
<body>
<header><b>HARNESS</b><a href="#" data-view="fleet" class="nav on">Fleet</a><a href="#" data-view="spend" class="nav">Spend</a><span class="sp"></span><span id="today" class="dim"></span><span id="daemon"><span class="dot"></span>daemon</span></header>
<aside>
  <h4>Projects</h4>
  <div id="projects"></div>
  <form id="addForm"><input id="addPath" placeholder="/absolute/path/to/repo" autocomplete="off"><button>add</button></form>
  <p style="color:var(--dim);font-size:11px;margin:10px 4px">Sessions in folders you haven't added show up under <i>discovered</i>.</p>
</aside>
<main id="main"></main>
<script src="/app.js"></script>
</body>
</html>
